<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan check</title>
  <style>
    :root {
      --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
      --line: #deded8; --accent: #2f5bd3; --ok-bg: #eef3ff; --err: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --card: #20201e; --text: #ecece8; --muted: #a0a09a;
        --line: #34342f; --accent: #8aa8ff; --ok-bg: #1f2638; --err: #ff8a80;
      }
    }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .intro { color: var(--muted); margin: 0 0 24px; }
    section.case { background: var(--card); border: 1px solid var(--line);
                   border-radius: 10px; padding: 16px; margin-bottom: 20px; }
    section.case h2 { font-size: 17px; margin: 0 0 6px; }
    .inputs { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
    .expect { background: var(--ok-bg); border-left: 3px solid var(--accent);
              padding: 6px 10px; margin: 0 0 12px; font-size: 14px; }
    .heading { font-weight: 600; margin: 0 0 2px; }
    .note { font-style: italic; margin: 0 0 10px; }
    .day { border-top: 1px solid var(--line); padding: 8px 0; }
    .day-label { font-weight: 600; }
    .kind { color: var(--muted); font-weight: 400; font-size: 13px; }
    ul { margin: 4px 0 0; padding-left: 20px; }
    li { margin: 4px 0; }
    .time { font-variant-numeric: tabular-nums; color: var(--accent); }
    .how { color: var(--muted); font-size: 13px; }
    .error { color: var(--err); white-space: pre-wrap; }
    button { margin-top: 12px; font: inherit; padding: 6px 12px; border-radius: 6px;
             border: 1px solid var(--accent); background: var(--accent); color: var(--card);
             cursor: pointer; max-width: 100%; }
    details { margin-top: 10px; }
    summary { cursor: pointer; color: var(--accent); }
    pre { font-size: 12px; overflow-x: auto; background: var(--bg); padding: 8px;
          border-radius: 6px; border: 1px solid var(--line); }
  </style>
</head>
<body>
<main>
  <h1>Plan check</h1>
  <p class="intro" id="intro"></p>
  <div id="cases"></div>
</main>

<!-- tasks.js must load before plan.js -->
<script src="tasks.js"></script>
<script src="plan.js"></script>
<script src="ics.js"></script>
<script>
  // A fixed "now" so the results never change: Monday 16 Nov 2026, 10:00 am.
  // (Month is 10 because JavaScript months start at 0.)
  const NOW = new Date(2026, 10, 16, 10, 0);
  const TODAY = toDateString(NOW);

  // Each case: a name, the form values, and what we expect to see.
  const CASES = [
    {
      name: "0 days left (interview today)",
      input: { interviewDate: addDays(TODAY, 0), company: "Fieldstone", role: "Senior PM" },
      expect: "Heading ends 'Interview today'. Interview day only: checklist at 8:00 am " +
              "(says 'review your top 3 stories once'), interview at 9:00 am. No note.",
    },
    {
      name: "1 day left",
      input: { interviewDate: addDays(TODAY, 1), company: "Fieldstone", role: "Senior PM" },
      expect: "Heading ends '1 day to go' (singular). Today: one combined task at 6:00 pm. " +
              "Interview day labelled '1 day from today'. No note.",
    },
    {
      name: "2 days left",
      input: { interviewDate: addDays(TODAY, 2), company: "Fieldstone", role: "Senior PM" },
      expect: "Today: the two combined tasks at 6:00 pm and 6:45 pm. Tomorrow: logistics and rest. Then interview day.",
    },
    {
      name: "3 days left (only room for priority 1)",
      input: { interviewDate: addDays(TODAY, 3), company: "Fieldstone", role: "Senior PM" },
      expect: "2 prep days, priority-1 tasks only, in plan order: Research + Write stories, then " +
              "Tell me about yourself + Prepare questions. 'Use the product' is dropped even though it is placed 2nd.",
    },
    {
      name: "4 days left (some priority 2 dropped)",
      input: { interviewDate: addDays(TODAY, 4), company: "Fieldstone", role: "Senior PM" },
      expect: "3 prep days, room for 6 tasks: the four priority-1 tasks plus the two highest-ranked priority-2 " +
              "(question you dread, mock interview). 'Use the product' is dropped. Days: Research + Write stories, " +
              "Tell me about yourself + Prepare questions, Question you dread + Mock interview.",
    },
    {
      name: "7 days left",
      input: { interviewDate: addDays(TODAY, 7), company: "Fieldstone", role: "Senior PM" },
      expect: "6 prep days, all 7 tasks: Research + Use the product on day 1, then Write stories, Tell me about yourself, " +
              "Prepare questions, Question you dread, Mock interview (last, closest to the interview). Mock interviews: 1.",
    },
    {
      name: "20 days left (plan starts later)",
      input: { interviewDate: addDays(TODAY, 20), company: "Fieldstone", role: "Senior PM" },
      expect: "Heading says 20 days to go. Note: 'Your plan starts on Sunday 22 November, two weeks before your interview…'. " +
              "13 prep days: the 7 tasks in plan order, then 6 spare days: Practise out loud, Another mock interview, " +
              "Practise out loud, Refine your stories, Practise out loud, Refine your stories. Mock interviews: 2.",
    },
    {
      name: "Interview type chosen: Technical, 10 days left, custom times",
      input: {
        interviewDate: addDays(TODAY, 10), company: "Smith, Jones & Co", role: "Data Engineer",
        interviewType: "technical", interviewTime: "14:30", prepTime: "07:30", prepMinutes: 30,
      },
      expect: "9 prep days: the 7 tasks in plan order, then Technical practice, then 1 spare day (Practise out loud). " +
              "Prep at 7:30–8:00 am. Checklist 1:30 pm, interview 2:30 pm. Company name shown with its comma. Mock interviews: 1.",
    },
    {
      name: "Escaping and folding (awkward company name)",
      input: {
        interviewDate: addDays(TODAY, 3), company: "Café \"Zürich\"; Müller, Ltd \\ 東京",
        role: "Head of Product – Payments 🚀",
      },
      expect: "Page shows the name exactly as typed. In the .ics text: every , ; and \\ has a \\ in front; " +
              "long lines are split, with the next piece starting with one space. " +
              "File name: prep-cafe-zurich-muller-ltd-" + addDays(TODAY, 3) + ".ics",
    },
  ];

  // ── Formatting helpers (display only) ──
  function localDate(dateString, minutes = 0) {
    const [y, m, d] = dateString.split("-").map(Number);
    return new Date(y, m - 1, d, 0, minutes);   // overflow past midnight rolls into the next day
  }
  function formatDate(dateString) {
    return localDate(dateString).toLocaleDateString("en-GB",
      { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  }
  function formatTime(dateString, minutes) {
    return localDate(dateString, minutes).toLocaleTimeString("en-US",
      { hour: "numeric", minute: "2-digit" }).toLowerCase();
  }
  const KIND_LABELS = { prep: "prep day", dayBefore: "day before", interview: "interview day" };

  // Small helper to create an element with text (textContent is safe for any input).
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  document.getElementById("intro").textContent =
    "Pretend 'now' is " + NOW.toLocaleString("en-GB", { dateStyle: "full", timeStyle: "short" }) +
    ". Each box shows the input, what we expect, and what buildPlan actually produced.";

  const container = document.getElementById("cases");

  for (const testCase of CASES) {
    const section = el("section", "case");
    section.append(el("h2", null, testCase.name));
    section.append(el("p", "inputs", "Input: " + JSON.stringify(testCase.input)));
    section.append(el("p", "expect", "Expect: " + testCase.expect));

    try {
      const plan = buildPlan(testCase.input, NOW);
      const allItems = plan.days.flatMap((day) => day.items);
      const mockCount = allItems.filter((item) => /mock interview/i.test(item.title)).length;

      section.append(el("p", "heading", plan.heading));
      section.append(el("p", "inputs",
        "daysLeft = " + plan.daysLeft + " · " + daysText(plan.days.length) + " with tasks · " +
        "Mock interviews: " + mockCount));
      section.append(el("p", "note", plan.note ? "Note: " + plan.note : "Note: (none)"));

      for (const day of plan.days) {
        const dayBox = el("div", "day");
        const label = el("div", "day-label", formatDate(day.date) + "  ");
        label.append(el("span", "kind", "(" + KIND_LABELS[day.kind] + ", " +
                                         daysText(daysBetween(TODAY, day.date)) + " from today)"));
        dayBox.append(label);

        const list = el("ul");
        for (const item of day.items) {
          const li = el("li");
          li.append(el("span", "time",
            formatTime(item.date, item.startMinutes) + "–" +
            formatTime(item.date, item.startMinutes + item.minutes) + "  "));
          li.append(el("strong", null, item.title));
          li.append(el("span", "how", "  · reminder " + item.reminderMinutes + " min before"));
          li.append(el("div", "how", item.how));
          list.append(li);
        }
        dayBox.append(list);
        section.append(dayBox);
      }

      // Calendar file: a download button, plus the raw text to read.
      const button = el("button", null, "Download .ics (" + icsFileName(plan) + ")");
      button.addEventListener("click", () => downloadIcs(plan));
      section.append(button);

      const details = el("details");
      details.append(el("summary", null, "Show .ics text"));
      details.append(el("pre", null, buildIcs(plan)));
      section.append(details);
    } catch (error) {
      section.append(el("p", "error", "ERROR: " + error.message));
    }

    container.append(section);
  }
</script>
</body>
</html>
